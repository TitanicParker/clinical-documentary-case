name: Append 2026 genetic confirmation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-genetic-confirmation.yml'

permissions:
  contents: write

jobs:
  append-record:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Append genetic confirmation to complete record
        shell: bash
        run: |
          if grep -q '^CLIN-003220  # DOCUMENT 20' complete-record.md; then
            echo "Document already present; no append required."
            exit 0
          fi

          cat >> complete-record.md <<'EOF'

CLIN-003220  # DOCUMENT 20 — St Vincent's Genetic Confirmation — 2026-02-04

CLIN-003221  # St Vincent's University Hospital — Department of Neurology

CLIN-003222  **Source:** Photograph of original clinical letter supplied directly by Liam Moloney in project conversation on 18 August 2026.
CLIN-003223  **Document type:** Consultant neurology genetic-results letter.
CLIN-003224  **Transcription status:** Direct transcription from supplied photograph. Layout has been normalised into Markdown; wording of the clinical conclusion is preserved.

CLIN-003225  ## Source metadata

CLIN-003226  **Page marker:** 26
CLIN-003227  **Confidentiality marking:** STRICTLY PRIVATE AND CONFIDENTIAL
CLIN-003228  **Hospital:** St. Vincent's University Hospital, Elm Park, Dublin 4, Ireland
CLIN-003229  **Department:** Department of Neurology
CLIN-003230  **Addressee:** Dr. Aaron Brennan, Galway East Med Prc, 5 Doughiska Retail Ctr, Doughiska Rd, Galway
CLIN-003231  **Date Dictated:** 03/02/2026
CLIN-003232  **Date typed:** [blank on source]
CLIN-003233  **Our Ref:** SO'R/MP
CLIN-003234  **Re:** Liam Moloney, 39 Dun Na Mara, Renmore, Galway City, County Galway
CLIN-003235  **D.O.B:** 12/11/1977
CLIN-003236  **MRN:** 1236004
CLIN-003237  **Phone number:** 0833694730

CLIN-003238  ## Letter

CLIN-003239  > Dear Dr. Brennan
CLIN-003240  >
CLIN-003241  > I received the results of Liam Moloney's genetic tests. They confirm that he has two pathogenic variants in the Parkin gene as predicted. His Parkinsonism and dystonia are due to compound heterozygous mutations in the Parkin gene. I plan to see him again in clinic.
CLIN-003242  >
CLIN-003243  > Yours sincerely,

CLIN-003244  **Signed:** Dr. Sean O'Riordan
CLIN-003245  **Role:** Consultant Neurologist
CLIN-003246  **IMCN:** 19306
CLIN-003247  **E-signed & Approved:** 04/02/2026
CLIN-003248  **Cc:** Mr. Liam Moloney, 39 Dun Na Mara, Renmore, Galway City, County Galway
EOF

      - name: Commit appended record
        shell: bash
        run: |
          if git diff --quiet -- complete-record.md; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complete-record.md
          git commit -m "Append 2026 Parkin genetic confirmation to complete record"
          git push

# Triggered after workflow installation so the push event is evaluated against an existing workflow.
